              '<button type="button" class="btn btn-secondary btn-md" data-action="close-modal">취소</button>' +
              '</div></div></div>';
            return;
          }
        }

        function renderToast() {
          var root = document.getElementById('toast-root');
          if (!ui.toast) {
            root.innerHTML = '';
            return;
          }
          root.innerHTML =
            '<div class="toast-box" role="status" aria-live="polite">' +
            '<p style="font-size:14px;font-weight:600;color:#F6D57A;">' + escapeHtml(ui.toast.title) + '</p>' +
            (ui.toast.detail ? '<p style="margin-top:2px;font-size:12px;color:var(--text-secondary);">' + escapeHtml(ui.toast.detail) + '</p>' : '') +
            '</div>';
        }

        function renderApp() {
          renderSidebar();
          renderHeaderAndMobileDrawer();
          var mainEl = document.getElementById('app-main');
          if (ui.activeView === 'today') mainEl.innerHTML = renderTodayView();
          else if (ui.activeView === 'stats') mainEl.innerHTML = renderStatsView();
          else if (ui.activeView === 'ranks') mainEl.innerHTML = renderRanksView();
          else mainEl.innerHTML = renderHistoryView();
          renderModals();
        }

        // ============================================================
        // 8. Event Delegation
        // ============================================================

        document.addEventListener('click', function (e) {
          var btn = e.target.closest('[data-action]');
          if (!btn) return;
          var action = btn.getAttribute('data-action');

          if (action === 'nav') {
            ui.activeView = btn.getAttribute('data-view');
            ui.mobileMenuOpen = false;
            renderApp();
          } else if (action === 'toggle-mobile-menu') {
            ui.mobileMenuOpen = !ui.mobileMenuOpen;
            renderHeaderAndMobileDrawer();
          } else if (action === 'download-html') {
            ui.mobileMenuOpen = false;
            renderHeaderAndMobileDrawer();
            downloadIndexHtml();
          } else if (action === 'open-modal') {
            var modalType = btn.getAttribute('data-modal');
            ui.modal = modalType;
            ui.mobileMenuOpen = false;
            ui.confirmProfileReset = false;
            if (modalType === 'manualLog') {
              ui.manualTaskId = ui.selectedTaskId || '';
            }
            if (modalType === 'profile') {
              ui.profileDraft = {
                branch: state.profile.branch,
                callsign: state.profile.callsign,
                unitName: state.profile.unitName,
                dailyGoalMinutes: state.profile.dailyGoalMinutes,
                studyTrack: state.profile.studyTrack,
                autoPlanEnabled: state.profile.autoPlanEnabled,
                exams: state.profile.exams.map(function (ex) {
                  return { id: ex.id, title: ex.title, date: ex.date };
                }),
              };
            }
            renderModals();
          } else if (action === 'close-modal') {
            ui.modal = null;
            renderModals();
          } else if (action === 'close-promotion') {
            ui.promotedRank = null;
            ui.promotedBonusSp = 0;
            renderModals();
          } else if (action === 'next-medal') {
            if (ui.medalIndex < ui.pendingMedals.length - 1) {
              ui.medalIndex += 1;
            } else {
              ui.pendingMedals = [];
              ui.medalIndex = 0;
            }
            renderModals();
          } else if (action === 'start-edit-name') {
            ui.isEditingName = true;
            renderApp();
          } else if (action === 'cancel-edit-name') {
            ui.isEditingName = false;
            renderApp();
          } else if (action === 'change-branch') {
            var branch = btn.getAttribute('data-branch');
            var defaults = Object.keys(BRANCH_META).map(function (k) { return BRANCH_META[k].defaultUnit; });
            if (defaults.indexOf(state.profile.unitName.trim()) !== -1) {
              state.profile.unitName = BRANCH_META[branch].defaultUnit;
            }
            state.profile.branch = branch;
            persistAndRender();
            showToast('군종이 ' + BRANCH_META[branch].label + '(으)로 변경되었습니다', BRANCH_META[branch].motto);
          } else if (action === 'start-add-exam') {
            ui.editingExamId = null;
            ui.isAddingExam = true;
            renderApp();
          } else if (action === 'cancel-add-exam') {
            ui.isAddingExam = false;
            renderApp();
          } else if (action === 'start-edit-exam') {
            ui.isAddingExam = false;
            ui.editingExamId = btn.getAttribute('data-exam-id');
            renderApp();
          } else if (action === 'cancel-edit-exam') {
            ui.editingExamId = null;
            renderApp();
          } else if (action === 'delete-exam') {
            var delExamId = btn.getAttribute('data-exam-id');
            var removed = state.profile.exams.find(function (ex) { return ex.id === delExamId; });
            state.profile.exams = state.profile.exams.filter(function (ex) { return ex.id !== delExamId; });
            if (ui.editingExamId === delExamId) ui.editingExamId = null;
            persistAndRender();
            showToast('시험 일정이 삭제되었습니다', removed ? removed.title : '');
          } else if (action === 'timer-mode') {
            if (ui.timer.isRunning) return;
            ui.timer.mode = btn.getAttribute('data-mode');
            ui.timer.secondsElapsed = 0;
            renderApp();
          } else if (action === 'timer-preset') {
            if (ui.timer.isRunning) return;
            ui.timer.presetMinutes = Number(btn.getAttribute('data-minutes')) || 25;
            ui.timer.secondsElapsed = 0;
            renderApp();
          } else if (action === 'timer-toggle') {
            if (ui.timer.isRunning) {
              stopTimerInterval();
              renderApp();
            } else {
              startTimerInterval();
            }
          } else if (action === 'timer-reset') {
            stopTimerInterval();
            ui.timer.secondsElapsed = 0;
            renderApp();
          } else if (action === 'timer-claim') {
            var studiedMinutes = Math.max(1, Math.floor(ui.timer.secondsElapsed / 60));
            stopTimerInterval();
            ui.timer.secondsElapsed = 0;
            var activeTask = getActiveTimerTask();
            var cat = activeTask ? activeTask.category : ui.timer.freeCategory;
            completeStudyMinutes(
              {
                taskId: activeTask ? activeTask.id : undefined,
                title: activeTask ? activeTask.title : CATEGORY_META[cat].label + ' 집중',
                category: cat,
                minutes: studiedMinutes,
              },
              'timer'
            );
          } else if (action === 'task-filter') {
            ui.taskFilter = btn.getAttribute('data-filter');
            renderApp();
          } else if (action === 'select-task') {
            var tId = btn.getAttribute('data-task-id');
            ui.selectedTaskId = tId;
            if (!ui.timer.isRunning) {
              var found = state.tasks.find(function (t) { return t.id === tId; });
              if (found) {
                ui.timer.mode = 'pomodoro';
                ui.timer.presetMinutes = Math.max(1, found.targetMinutes - found.loggedMinutes);
                ui.timer.secondsElapsed = 0;
              }
            }
            renderApp();
          } else if (action === 'delete-task') {
            var delId = btn.getAttribute('data-task-id');
            if (ui.selectedTaskId === delId) ui.selectedTaskId = null;
            state.tasks = state.tasks.filter(function (t) { return t.id !== delId; });
            persistAndRender();
          } else if (action === 'regen-plan') {
            ui.planVariantOffset += 1;
            var todayStr = getTodayDateStr();
            var freshTasks = generateDailyPlan({
              date: todayStr,
              dailyGoalMinutes: state.profile.dailyGoalMinutes,
              track: state.profile.studyTrack,
              variantOffset: ui.planVariantOffset,
            });
            var preserved = state.tasks.filter(function (t) {
              return t.scheduledDate !== todayStr || t.completed || !t.isAutoGenerated;
            });
            state.tasks = freshTasks.concat(preserved);
            ui.selectedTaskId = null;
            persistAndRender();
            showToast('오늘의 학습 계획이 새롭게 자동 편성되었습니다');
          } else if (action === 'upgrade-stat') {
            var statKey = btn.getAttribute('data-stat');
            var reqAmount = Number(btn.getAttribute('data-amount')) || 1;
            var avail = getSpSummary(state).availableSp;
            var actual = Math.min(reqAmount, avail);
            if (actual <= 0) return;
            state.stats[statKey] += actual;
            resolveNewlyUnlockedMedals();
            persistAndRender();
            showToast(
              STAT_META[statKey].label + ' +' + actual + ' 강화 완료 (Lv.' + state.stats[statKey] + ')',
              STAT_META[statKey].effectSummary
            );
          } else if (action === 'reset-stats') {
            state.stats = { concentration: 1, intellect: 1, memory: 1, endurance: 1, willpower: 1 };
            persistAndRender();
            showToast('스탯 포인트가 초기화되었습니다', '모든 SP를 다시 투자할 수 있습니다.');
          } else if (action === 'rank-filter') {
            ui.rankGroupFilter = btn.getAttribute('data-group');
            renderApp();
          } else if (action === 'medal-filter') {
            ui.medalCategoryFilter = btn.getAttribute('data-category');
            renderApp();
          } else if (action === 'manual-preset') {
            var minInput = document.getElementById('manual-min-input');
            if (minInput) minInput.value = btn.getAttribute('data-minutes');
          } else if (action === 'profile-add-exam') {
            if (ui.profileDraft) {
              ui.profileDraft.exams.push({
                id: 'exam-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5),
                title: '',
                date: getDefaultExamDateStr(30),
              });
            }
            renderModals();
          } else if (action === 'profile-remove-exam') {
            var remId = btn.getAttribute('data-exam-id');
            if (ui.profileDraft) {
              ui.profileDraft.exams = ui.profileDraft.exams.filter(function (ex) { return ex.id !== remId; });
            }
            renderModals();
          } else if (action === 'ask-profile-reset') {
            ui.confirmProfileReset = true;
            renderModals();
          } else if (action === 'cancel-profile-reset') {
            ui.confirmProfileReset = false;
            renderModals();
          } else if (action === 'confirm-reset-rank-only') {
            stopTimerInterval();
            ui.timer.secondsElapsed = 0;
            state = resetRankOnlyState(state);
            ui.pendingMedals = [];
            ui.promotedRank = null;
            ui.modal = null;
            persistAndRender();
            showToast('계급과 스탯이 훈련병으로 초기화되었습니다', '기존 학습 일지와 시간 기록은 유지됩니다.');
          } else if (action === 'confirm-reset-all') {
            stopTimerInterval();
            ui.timer.secondsElapsed = 0;
            state = resetAllPlannerData();
            ui.selectedTaskId = null;
            ui.pendingMedals = [];
            ui.promotedRank = null;
            ui.modal = null;
            renderApp();
            showToast('모든 학습 데이터가 초기화되었습니다');
          }
        });

        document.addEventListener('change', function (e) {
          var target = e.target;
          if (target.id === 'timer-task-select') {
            var val = target.value || null;
            ui.selectedTaskId = val;
            if (!ui.timer.isRunning && val) {
              var found = state.tasks.find(function (t) { return t.id === val; });
              if (found) {
                ui.timer.mode = 'pomodoro';
                ui.timer.presetMinutes = Math.max(1, found.targetMinutes - found.loggedMinutes);
                ui.timer.secondsElapsed = 0;
              }
            }
            renderApp();
          } else if (target.id === 'timer-category-select') {
            ui.timer.freeCategory = target.value;
            renderApp();
          } else if (target.id === 'today-track-select') {
            var track = target.value;
            ui.planVariantOffset += 1;
            var todayStr = getTodayDateStr();
            var fresh = generateDailyPlan({
              date: todayStr,
              dailyGoalMinutes: state.profile.dailyGoalMinutes,
              track: track,
              variantOffset: ui.planVariantOffset,
            });
            var preserved = state.tasks.filter(function (t) {
              return t.scheduledDate !== todayStr || t.completed || !t.isAutoGenerated;
            });
            state.profile.studyTrack = track;
            state.tasks = fresh.concat(preserved);
            ui.selectedTaskId = null;
            persistAndRender();
            showToast(STUDY_TRACK_META[track].label + ' 코스로 계획이 자동 편성되었습니다');
          } else if (target.id === 'history-cat-select') {
            ui.historyCategoryFilter = target.value;
            renderApp();
          } else if (target.id === 'manual-task-select') {
            ui.manualTaskId = target.value;
            renderModals();
          } else if (target.hasAttribute('data-profile-exam-date') && ui.profileDraft) {
            var dId = target.getAttribute('data-profile-exam-date');
            ui.profileDraft.exams = ui.profileDraft.exams.map(function (ex) {
              return ex.id === dId ? Object.assign({}, ex, { date: target.value }) : ex;
            });
          } else if (ui.modal === 'profile' && ui.profileDraft && target.form && target.form.getAttribute('data-form') === 'save-profile') {
            if (target.name === 'branch') ui.profileDraft.branch = target.value;
            else if (target.name === 'studyTrack') ui.profileDraft.studyTrack = target.value;
            else if (target.name === 'autoPlanEnabled') ui.profileDraft.autoPlanEnabled = Boolean(target.checked);
          }
        });

        document.addEventListener('input', function (e) {
          var target = e.target;
          if (target.id === 'history-search-input') {
            ui.historySearch = target.value;
            var pos = target.selectionStart;
            renderApp();
            var nextInput = document.getElementById('history-search-input');
            if (nextInput) {
              nextInput.focus();
              if (typeof pos === 'number') nextInput.setSelectionRange(pos, pos);
            }
          } else if (target.hasAttribute('data-profile-exam-title') && ui.profileDraft) {
            var tId = target.getAttribute('data-profile-exam-title');
            ui.profileDraft.exams = ui.profileDraft.exams.map(function (ex) {
              return ex.id === tId ? Object.assign({}, ex, { title: target.value }) : ex;
            });
          } else if (ui.modal === 'profile' && ui.profileDraft && target.form && target.form.getAttribute('data-form') === 'save-profile') {
            if (target.name === 'callsign') ui.profileDraft.callsign = target.value;
            else if (target.name === 'unitName') ui.profileDraft.unitName = target.value;
            else if (target.name === 'dailyGoalMinutes') ui.profileDraft.dailyGoalMinutes = Number(target.value) || 120;
          }
        });

        document.addEventListener('submit', function (e) {
          var form = e.target;
          if (!form || !form.hasAttribute('data-form')) return;
          e.preventDefault();
          var kind = form.getAttribute('data-form');

          if (kind === 'save-callsign') {
            var nameVal = (form.elements.callsign.value || '').trim();
            if (nameVal) state.profile.callsign = nameVal;
            ui.isEditingName = false;
            var rank = getRankByXp(state.totalXp);
            persistAndRender();
            showToast('이름이 변경되었습니다', BRANCH_META[state.profile.branch].label + ' ' + rank.name + ' ' + state.profile.callsign);
          } else if (kind === 'add-exam') {
            var eTitle = (form.elements.title.value || '').trim() || '목표 시험';
            var eDate = form.elements.date.value;
            if (!eDate) return;
            state.profile.exams.push({
              id: 'exam-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
              title: eTitle,
              date: eDate,
            });
            ui.isAddingExam = false;
            var dDayAdd = calculateDDay(eDate);
            persistAndRender();
            showToast('새 시험 일정이 추가되었습니다', dDayAdd ? eTitle + ' (' + dDayAdd.formattedDate + ' · ' + dDayAdd.label + ')' : eTitle);
          } else if (kind === 'update-exam') {
            var exId = form.getAttribute('data-exam-id');
            var uTitle = (form.elements.title.value || '').trim() || '목표 시험';
            var uDate = form.elements.date.value;
            if (!uDate) return;
            state.profile.exams = state.profile.exams.map(function (ex) {
              return ex.id === exId ? { id: ex.id, title: uTitle, date: uDate } : ex;
            });
            ui.editingExamId = null;
            var dDayUpd = calculateDDay(uDate);
            persistAndRender();
            showToast('시험 일정이 수정되었습니다', dDayUpd ? uTitle + ' (' + dDayUpd.formattedDate + ' · ' + dDayUpd.label + ')' : uTitle);
          } else if (kind === 'quick-task') {
            var qTitle = (form.elements.title.value || '').trim();
            if (!qTitle) return;
            var todayStr = getTodayDateStr();
            state.tasks.unshift({
              id: 'task-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
              title: qTitle,
              category: 'major',
              targetMinutes: 30,
              loggedMinutes: 0,
              difficulty: 'normal',
              completed: false,
              xpAwarded: 0,
              isAutoGenerated: false,
              createdAt: new Date().toISOString(),
              scheduledDate: todayStr,
            });
            persistAndRender();
            showToast('새 학습 과제가 등록되었습니다', qTitle);
          } else if (kind === 'add-task') {
            var aTitle = (form.elements.title.value || '').trim();
            if (!aTitle) return;
            var aCat = form.elements.category.value;
            var aMins = Math.max(5, Math.min(480, Number(form.elements.targetMinutes.value) || 40));
            var aDiff = form.elements.difficulty.value;
            state.tasks.unshift({
              id: 'task-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
              title: aTitle,
              category: aCat,
              targetMinutes: aMins,
              loggedMinutes: 0,
              difficulty: aDiff,
              completed: false,
              xpAwarded: 0,
              isAutoGenerated: false,
              createdAt: new Date().toISOString(),
              scheduledDate: getTodayDateStr(),
            });
            ui.modal = null;
            persistAndRender();
            showToast('새 학습 과제가 등록되었습니다', aTitle);
          } else if (kind === 'manual-log') {
            var mTaskId = form.elements.taskId ? form.elements.taskId.value : '';
            var mCat = form.elements.category.value;
            var mTitle = (form.elements.title.value || '').trim() || CATEGORY_META[mCat].label + ' 학습';
            var mMins = Math.max(1, Math.min(600, Number(form.elements.minutes.value) || 30));
            ui.modal = null;
            completeStudyMinutes(
              {
                taskId: mTaskId || undefined,
                title: mTitle,
                category: mCat,
                minutes: mMins,
              },
              'manual'
            );
          } else if (kind === 'save-profile') {
            var nextBranch = form.elements.branch.value;
            var nextCallsign = (form.elements.callsign.value || '').trim() || '김전술';
            var rawUnit = (form.elements.unitName.value || '').trim();
            var defaults = Object.keys(BRANCH_META).map(function (k) { return BRANCH_META[k].defaultUnit; });
            var nextUnit =
              !rawUnit
                ? BRANCH_META[nextBranch].defaultUnit
                : nextBranch !== state.profile.branch && defaults.indexOf(rawUnit) !== -1
                  ? BRANCH_META[nextBranch].defaultUnit
                  : rawUnit;
            var nextGoal = Math.max(15, Math.min(720, Number(form.elements.dailyGoalMinutes.value) || 120));
            var nextTrack = form.elements.studyTrack.value;
            var nextAutoPlan = Boolean(form.elements.autoPlanEnabled.checked);
            var sourceExams = ui.profileDraft ? ui.profileDraft.exams : state.profile.exams;
            var cleanedExams = sourceExams
              .filter(function (ex) { return ex.date && ex.date.trim().length > 0; })
              .map(function (ex) { return { id: ex.id, title: (ex.title || '').trim() || '목표 시험', date: ex.date }; });

            var trackOrGoalChanged =
              nextTrack !== state.profile.studyTrack || nextGoal !== state.profile.dailyGoalMinutes;

            state.profile = {
              branch: nextBranch,
              callsign: nextCallsign,
              unitName: nextUnit,
              dailyGoalMinutes: nextGoal,
              studyTrack: nextTrack,
              autoPlanEnabled: nextAutoPlan,
              exams: cleanedExams,
            };

            if (trackOrGoalChanged && nextAutoPlan) {
              var tDate = getTodayDateStr();
              var freshPlan = generateDailyPlan({
                date: tDate,
                dailyGoalMinutes: nextGoal,
                track: nextTrack,
                variantOffset: ui.planVariantOffset,
              });
              var kept = state.tasks.filter(function (t) {
                return t.scheduledDate !== tDate || t.completed || !t.isAutoGenerated;
              });
              state.tasks = freshPlan.concat(kept);
            }

            ui.modal = null;
            persistAndRender();
            showToast('설정이 저장되었습니다');
          }
        });

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') {
            if (ui.promotedRank) {
              ui.promotedRank = null;
              ui.promotedBonusSp = 0;
              renderModals();
            } else if (ui.pendingMedals.length > 0) {
              ui.pendingMedals = [];
              ui.medalIndex = 0;
              renderModals();
            } else if (ui.modal) {
              ui.modal = null;
              renderModals();
            }
          }
        });

        // Initial Boot
        renderApp();
      })();
    </script>
