<!doctype html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>밀리스터디 — 계급 진급 &amp; 스탯 성장 플래너</title>
    <meta name="description" content="공부한 만큼 경험치와 계급이 오르고 5대 학습 스탯을 키우는 자동 편성 스터디 플래너">
    <meta property="og:title" content="밀리스터디 — 계급 진급 &amp; 스탯 성장 플래너">
    <meta property="og:description" content="공부한 만큼 경험치와 계급이 오르고 5대 학습 스탯을 키우는 자동 편성 스터디 플래너">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-canvas: #0f1419;
        --bg-sidebar: #13181f;
        --bg-surface: #161c24;
        --bg-surface-hover: #1c242e;
        --bg-control: #232b35;
        --border-subtle: #232b35;
        --border-strong: #2a3441;
        --border-muted: #3b4856;
        --text-primary: #e6edf3;
        --text-secondary: #c9d1d9;
        --text-muted: #8b949e;
        --text-faint: #6e7681;
        --accent-gold: #d4a843;
        --accent-gold-light: #f6d57a;
        --accent-gold-hover: #e5ba54;
        --accent-green: #5e8c61;
        --accent-green-hover: #6b9f6e;
        --accent-red: #dc2626;
        --accent-red-soft: #fca5a5;
        --font-display: "Outfit", "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
        --font-sans: "IBM Plex Sans KR", "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
      }

      ::selection {
        background: rgba(212, 168, 67, 0.3);
        color: var(--accent-gold-light);
      }

      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
        background: none;
        border: 0;
        padding: 0;
      }

      button:disabled,
      select:disabled,
      input:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent-gold);
        outline-offset: 2px;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      p,
      h1,
      h2,
      h3 {
        margin: 0;
      }

      .font-display {
        font-family: var(--font-display);
      }

      .font-mono {
        font-family: var(--font-mono);
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }

      /* App Shell */
      .app-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .sidebar {
        display: none;
      }

      .main-column {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      /* Top Sticky Header */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--border-subtle);
        background: rgba(15, 20, 25, 0.94);
        backdrop-filter: blur(8px);
        padding: 12px 16px;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .menu-toggle-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
        flex-shrink: 0;
      }

      .topbar-breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .topbar-sep {
        color: var(--border-muted);
        flex-shrink: 0;
      }

      .topbar-date {
        font-size: 12px;
        font-weight: 400;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .topbar-dday {
        display: none;
        font-family: var(--font-mono);
        font-size: 13px;
        font-weight: 600;
        color: var(--accent-gold);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .mobile-drawer {
        border-bottom: 1px solid var(--border-subtle);
        background: var(--bg-sidebar);
        padding: 12px 16px;
      }

      .main-viewport {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 16px 40px;
        flex: 1;
      }

      @media (min-width: 640px) {
        .topbar {
          padding: 14px 24px;
        }
        .topbar-breadcrumb {
          font-size: 16px;
        }
        .topbar-date {
          font-size: 13px;
        }
        .topbar-dday {
          display: inline;
        }
        .main-viewport {
          padding: 24px 24px 48px;
        }
      }

      @media (min-width: 768px) {
        .app-shell {
          flex-direction: row;
        }
        .sidebar {
          display: flex;
          width: 260px;
          flex-shrink: 0;
          flex-direction: column;
          justify-content: space-between;
          border-right: 1px solid var(--border-subtle);
          background: var(--bg-sidebar);
          padding: 20px;
          position: sticky;
          top: 0;
          height: 100vh;
          overflow-y: auto;
        }
        .menu-toggle-btn,
        .mobile-drawer {
          display: none !important;
        }
      }

      @media (min-width: 1024px) {
        .topbar {
          padding: 14px 32px;
        }
        .main-viewport {
          padding: 24px 32px 48px;
        }
      }

      /* Sidebar Items */
      .brand-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border-subtle);
      }

      .brand-title {
        font-family: var(--font-display);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        white-space: nowrap;
      }

      .nav-list {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .nav-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-muted);
        transition: background-color 0.15s ease, color 0.15s ease;
        white-space: nowrap;
      }

      .nav-btn:hover {
        background: #192029;
        color: var(--text-primary);
      }

      .nav-btn.is-active {
        background: #1d2530;
        color: var(--accent-gold-light);
      }

      .nav-btn-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .nav-sp-tag {
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 600;
        color: var(--accent-gold);
      }

      .sidebar-footer {
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .sidebar-profile-btn {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        border-radius: 12px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-canvas);
        padding: 12px;
        text-align: left;
        transition: border-color 0.15s ease;
      }

      .sidebar-profile-btn:hover {
        border-color: var(--border-muted);
      }

      .sidebar-download-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-canvas);
        padding: 9px 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
        transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
      }

      .sidebar-download-btn:hover {
        border-color: rgba(212, 168, 67, 0.55);
        background: rgba(212, 168, 67, 0.08);
        color: var(--accent-gold-light);
      }

      .sidebar-profile-meta {
        min-width: 0;
        flex: 1;
      }

      .sidebar-profile-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .sidebar-profile-unit {
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Buttons & Inputs */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 14px;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }

      .btn-md {
        font-size: 13px;
        padding: 10px 16px;
      }

      .btn-sm {
        font-size: 12px;
        padding: 5px 10px;
      }

      .btn-primary {
        background: var(--accent-gold);
        color: var(--bg-canvas);
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--accent-gold-hover);
      }

      .btn-secondary {
        border: 1px solid var(--border-strong);
        background: var(--bg-surface);
        color: var(--text-secondary);
      }

      .btn-secondary:hover:not(:disabled) {
        border-color: var(--border-muted);
        color: #ffffff;
      }

      .btn-dark {
        border: 1px solid var(--border-strong);
        background: var(--bg-canvas);
        color: var(--text-muted);
      }

      .btn-dark:hover:not(:disabled) {
        border-color: rgba(212, 168, 67, 0.6);
        color: var(--accent-gold-light);
      }

      .btn-gold-outline {
        border: 1px solid rgba(212, 168, 67, 0.45);
        background: rgba(212, 168, 67, 0.12);
        color: var(--accent-gold-light);
      }

      .btn-gold-outline:hover:not(:disabled) {
        background: var(--accent-gold);
        color: var(--bg-canvas);
      }

      .btn-green {
        background: var(--accent-green);
        color: #ffffff;
      }

      .btn-green:hover:not(:disabled) {
        background: var(--accent-green-hover);
      }

      .btn-danger-outline {
        border: 1px solid var(--border-strong);
        background: var(--bg-canvas);
        color: var(--text-muted);
      }

      .btn-danger-outline:hover:not(:disabled) {
        border-color: rgba(220, 38, 38, 0.6);
        color: var(--accent-red-soft);
      }

      .btn-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px;
        border-radius: 6px;
        color: var(--text-faint);
        transition: background-color 0.15s ease, color 0.15s ease;
        flex-shrink: 0;
      }

      .btn-icon:hover {
        background: var(--bg-control);
        color: var(--text-primary);
      }

      .btn-icon.is-danger:hover {
        color: var(--accent-red);
      }

      .input,
      .select {
        border-radius: 8px;
        border: 1px solid var(--border-strong);
        background: var(--bg-canvas);
        padding: 8px 12px;
        font-size: 13px;
        color: var(--text-primary);
        transition: border-color 0.15s ease;
      }

      .input::placeholder {
        color: var(--text-faint);
      }

      .input:focus,
      .select:focus {
        outline: none;
        border-color: var(--accent-gold);
      }

      .input-date {
        color-scheme: dark;
        font-family: var(--font-mono);
      }

      .segmented {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-canvas);
        padding: 3px;
      }

      .seg-btn {
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-muted);
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .seg-btn:hover:not(:disabled) {
        color: var(--text-primary);
      }

      .seg-btn.is-active {
        background: var(--bg-control);
        color: var(--accent-gold-light);
      }

      .seg-btn.is-active-gold {
        background: var(--accent-gold);
        color: var(--bg-canvas);
        font-weight: 600;
      }

      /* Cards & Layout Grids */
      .stack-6 {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .stack-8 {
        display: flex;
        flex-direction: column;
        gap: 32px;
      }

      .card {
        border-radius: 12px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-surface);
        padding: 20px;
      }

      .card-lg {
        padding: 24px;
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      @media (min-width: 1024px) {
        .kpi-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      .stats-top-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      @media (min-width: 640px) {
        .stats-top-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .workspace-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        align-items: start;
      }

      @media (min-width: 1200px) {
        .workspace-grid {
          grid-template-columns: 5fr 7fr;
        }
      }

      .stats-main-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        align-items: stretch;
      }

      @media (min-width: 1024px) {
        .stats-main-grid {
          grid-template-columns: 5fr 7fr;
        }
      }

      .history-top-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
      }

      @media (min-width: 1200px) {
        .history-top-grid {
          grid-template-columns: 7fr 5fr;
        }
      }

      .ranks-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      @media (min-width: 768px) {
        .ranks-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (min-width: 1200px) {
        .ranks-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .medals-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      @media (min-width: 640px) {
        .medals-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (min-width: 1024px) {
        .medals-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      /* Rank Banner */
      .banner-top {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      @media (min-width: 1024px) {
        .banner-top {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
        }
      }

      .banner-identity {
        display: flex;
        align-items: flex-start;
        gap: 16px;
      }

      @media (min-width: 640px) {
        .banner-identity {
          align-items: center;
        }
      }

      .meta-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text-muted);
      }

      .name-row {
        margin-top: 4px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .rank-title {
        font-family: var(--font-display);
        font-size: 24px;
        font-weight: 700;
        color: var(--text-primary);
      }

      .branch-row {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }

      .xp-panel {
        width: 100%;
      }

      @media (min-width: 1024px) {
        .xp-panel {
          max-width: 360px;
        }
      }

      .progress-track {
        width: 100%;
        overflow: hidden;
        border-radius: 9999px;
        background: var(--bg-canvas);
        border: 1px solid var(--border-subtle);
      }

      .progress-fill {
        height: 100%;
        background: var(--accent-gold);
        transition: width 0.28s ease;
      }

      /* Exam D-Day Section inside Banner */
      .divider-top {
        margin-top: 16px;
        border-top: 1px solid var(--border-subtle);
        padding-top: 16px;
      }

      .exam-list {
        margin-top: 10px;
      }

      .exam-row {
        padding: 9px 0;
        border-bottom: 1px solid rgba(35, 43, 53, 0.75);
      }

      .exam-row:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .exam-row-flex {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      /* Focus Timer */
      .timer-well {
        margin-top: 20px;
        border-radius: 12px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-canvas);
        padding: 24px 20px;
        text-align: center;
      }

      .timer-digits {
        font-family: var(--font-mono);
        font-size: 52px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
        color: var(--text-primary);
      }

      @media (min-width: 640px) {
        .timer-digits {
          font-size: 60px;
        }
      }

      .preset-btn {
        border-radius: 6px;
        padding: 4px 10px;
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 500;
        color: var(--text-muted);
        border: 1px solid transparent;
        white-space: nowrap;
      }

      .preset-btn:hover:not(:disabled) {
        color: var(--text-primary);
      }

      .preset-btn.is-active {
        background: var(--bg-control);
        color: var(--accent-gold-light);
        border-color: rgba(212, 168, 67, 0.45);
      }

      /* Task Rows */
      .task-item {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px 0;
        border-bottom: 1px solid var(--border-subtle);
      }

      .task-item:last-child {
        border-bottom: 0;
      }

      @media (min-width: 640px) {
        .task-item {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
        }
      }

      .task-item.is-selected {
        background: rgba(212, 168, 67, 0.06);
        margin: 0 -8px;
        padding: 14px 8px;
        border-radius: 8px;
      }

      .task-status-circle {
        margin-top: 2px;
        width: 20px;
        height: 20px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        border: 1px solid var(--border-muted);
        background: var(--bg-canvas);
      }

      .task-status-circle.is-done {
        border-color: var(--accent-green);
        background: var(--accent-green);
        color: #ffffff;
      }

      .task-status-circle.is-target {
        border-color: var(--accent-gold);
        background: rgba(212, 168, 67, 0.15);
      }

      /* Heatmap & Bar Chart */
      .heatmap-grid {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 6px;
      }

      .heat-cell {
        aspect-ratio: 1 / 1;
        border-radius: 4px;
        border: 1px solid var(--border-subtle);
      }

      .barchart-grid {
        margin-top: 24px;
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
        align-items: end;
        height: 160px;
      }

      .bar-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        height: 100%;
      }

      .bar-well {
        width: 100%;
        max-width: 32px;
        flex: 1;
        display: flex;
        align-items: flex-end;
        background: var(--bg-canvas);
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid var(--border-subtle);
      }

      /* Table */
      .log-table-wrap {
        margin-top: 16px;
        overflow-x: auto;
      }

      .log-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        font-size: 13px;
      }

      .log-table th {
        padding: 10px 16px 10px 0;
        border-bottom: 1px solid var(--border-subtle);
        font-size: 12px;
        font-weight: 500;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .log-table td {
        padding: 12px 16px 12px 0;
        border-bottom: 1px solid var(--border-subtle);
      }

      .log-table tr:hover td {
        background: rgba(28, 36, 46, 0.55);
      }

      /* Medal Card Hover */
      .medal-card {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        border-radius: 12px;
        border: 1px solid #1e2630;
        background: rgba(15, 20, 25, 0.55);
        padding: 16px;
        opacity: 0.55;
        transition: transform 0.16s ease, border-color 0.16s ease;
      }

      .medal-card.is-unlocked {
        border-color: #323e4e;
        background: var(--bg-canvas);
        opacity: 1;
      }

      .medal-card.is-unlocked:hover {
        transform: translateY(-2px);
      }

      /* Modals & Animations */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.78);
        padding: 16px;
      }

      .modal-panel {
        width: 100%;
        max-width: 448px;
        max-height: 90vh;
        overflow-y: auto;
        border-radius: 12px;
        border: 1px solid var(--border-strong);
        background: var(--bg-surface);
        padding: 24px;
        position: relative;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
      }

      .modal-panel.is-wide {
        max-width: 512px;
      }

      .modal-panel.is-celebration {
        border-color: rgba(212, 168, 67, 0.6);
        text-align: center;
        overflow: hidden;
        animation: modalPop 0.36s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .reveal-badge-wrap {
        position: relative;
        margin-top: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .reveal-badge {
        animation: badgeSpring 0.52s cubic-bezier(0.22, 1.4, 0.36, 1) 0.06s both;
      }

      .reveal-ring {
        position: absolute;
        width: 96px;
        height: 96px;
        border-radius: 9999px;
        border: 2px solid var(--accent-gold);
        pointer-events: none;
        animation: ringExpand 0.85s ease-out 0.1s both;
      }

      .metallic-sheen {
        position: absolute;
        inset: 0 auto 0 0;
        width: 50%;
        pointer-events: none;
        background: linear-gradient(90deg, transparent, rgba(246, 213, 122, 0.16), transparent);
        transform: translateX(-140%) skewX(-12deg);
        animation: sheenSweep 0.95s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
      }

      .toast-box {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 45;
        max-width: 360px;
        border-radius: 12px;
        border: 1px solid rgba(212, 168, 67, 0.5);
        background: var(--bg-surface);
        padding: 12px 16px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
        animation: toastSlide 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes modalPop {
        from {
          opacity: 0;
          transform: scale(0.88) translateY(14px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes badgeSpring {
        from {
          opacity: 0;
          transform: scale(0.35) rotate(-14deg) translateY(-14px);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(0deg) translateY(0);
        }
      }

      @keyframes ringExpand {
        from {
          opacity: 0.75;
          transform: scale(0.5);
        }
        to {
          opacity: 0;
          transform: scale(1.75);
        }
      }

      @keyframes sheenSweep {
        from {
          transform: translateX(-140%) skewX(-12deg);
        }
        to {
          transform: translateX(300%) skewX(-12deg);
        }
      }

      @keyframes toastSlide {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

        function escapeHtml(value) {
          return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function getTodayDateStr() {
          var now = new Date();
          return (
            now.getFullYear() +
            '-' +
            String(now.getMonth() + 1).padStart(2, '0') +
            '-' +
            String(now.getDate()).padStart(2, '0')
          );
        }

        function getDefaultExamDateStr(daysAhead) {
          var d = new Date();
          d.setDate(d.getDate() + (daysAhead || 60));
          return (
            d.getFullYear() +
            '-' +
            String(d.getMonth() + 1).padStart(2, '0') +
            '-' +
            String(d.getDate()).padStart(2, '0')
          );
        }

        function formatKoreanDate(dateStr) {
          var parts = String(dateStr).split('-').map(Number);
          var date = new Date(parts[0], parts[1] - 1, parts[2]);
          var weekdays = ['일', '월', '화', '수', '목', '금', '토'];
          return parts[0] + '년 ' + parts[1] + '월 ' + parts[2] + '일 (' + weekdays[date.getDay()] + ')';
        }

        function formatMinutesKorean(totalMinutes) {
          var h = Math.floor(totalMinutes / 60);
          var m = totalMinutes % 60;
          if (h === 0) return m + '분';
          if (m === 0) return h + '시간';
          return h + '시간 ' + m + '분';
        }

        function getRankEnglishName(rank, branch) {
          if (branch === 'navy') return NAVY_ENGLISH_NAMES[rank.id] || rank.englishName;
          if (branch === 'airforce') return AIRFORCE_ENGLISH_NAMES[rank.id] || rank.englishName;
          return rank.englishName;
        }

        function getRankByXp(xp) {
          var current = MILITARY_RANKS[0];
          for (var i = 0; i < MILITARY_RANKS.length; i++) {
            if (xp >= MILITARY_RANKS[i].minXp) {
              current = MILITARY_RANKS[i];
            } else {
              break;
            }
          }
          return current;
        }

        function getNextRank(currentRank) {
          for (var i = 0; i < MILITARY_RANKS.length; i++) {
            if (MILITARY_RANKS[i].id === currentRank.id) {
              return i < MILITARY_RANKS.length - 1 ? MILITARY_RANKS[i + 1] : null;
            }
          }
          return null;
        }

        function getRankProgress(xp) {
          var currentRank = getRankByXp(xp);
          var nextRank = getNextRank(currentRank);
          if (!nextRank) {
            return {
              currentRank: currentRank,
              nextRank: null,
              serviceGrade: 4,
              xpIntoRank: xp - currentRank.minXp,
              xpForNextRank: 0,
              percent: 100,
            };
          }
          var span = nextRank.minXp - currentRank.minXp;
          var xpIntoRank = Math.max(0, xp - currentRank.minXp);
          var percent = Math.min(100, Math.round((xpIntoRank / span) * 100));
          var serviceGrade = Math.min(4, Math.floor((xpIntoRank / span) * 4) + 1);
          return {
            currentRank: currentRank,
            nextRank: nextRank,
            serviceGrade: serviceGrade,
            xpIntoRank: xpIntoRank,
            xpForNextRank: nextRank.minXp - xp,
            percent: percent,
          };
        }

        function getStatBonusPercent(statLevel) {
          return Math.max(0, (statLevel - 1) * 3);
        }

        function computeSessionXp(params) {
          var minutes = params.minutes;
          var category = params.category;
          var source = params.source;
          var difficulty = params.difficulty || 'normal';
          var stats = params.stats;
          var streak = params.streak;
          var diffMeta = DIFFICULTY_META[difficulty] || DIFFICULTY_META.normal;

          var baseXp =
            source === 'task'
              ? Math.round(diffMeta.baseBonusXp + minutes * 2.5 * diffMeta.multiplier)
              : Math.max(10, Math.round(minutes * 10));

          var bonusRate = 0;
          var bonusReasons = [];

          if (source === 'timer') {
            var cPct = getStatBonusPercent(stats.concentration);
            if (cPct > 0) {
              bonusRate += cPct / 100;
              bonusReasons.push('집중력 +' + cPct + '%');
            }
          }

          if (source === 'task') {
            var wPct = getStatBonusPercent(stats.willpower);
            if (wPct > 0) {
              bonusRate += wPct / 100;
              bonusReasons.push('결단력 +' + wPct + '%');
            }
          }

          var catStat = CATEGORY_META[category].primaryStat;
          if (catStat === 'intellect' || catStat === 'memory') {
            var catPct = getStatBonusPercent(stats[catStat]);
            if (catPct > 0) {
              bonusRate += catPct / 100;
              bonusReasons.push(STAT_META[catStat].label + ' +' + catPct + '%');
            }
          }

          if (minutes >= 40 || streak >= 2) {
            var ePct = getStatBonusPercent(stats.endurance);
            if (ePct > 0) {
              bonusRate += ePct / 100;
              bonusReasons.push('지구력 +' + ePct + '%');
            }
          }

          if (streak >= 2) {
            var streakPct = Math.min(25, (streak - 1) * 5);
            bonusRate += streakPct / 100;
            bonusReasons.push(streak + '일 연속 +' + streakPct + '%');
          }

          var bonusXp = Math.round(baseXp * bonusRate);
          return {
            baseXp: baseXp,
            bonusXp: bonusXp,
            totalXp: baseXp + bonusXp,
            bonusReasons: bonusReasons,
          };
        }

        function getEarnedPromotionSp(xp) {
          return MILITARY_RANKS.filter(function (r) { return xp >= r.minXp; }).reduce(
            function (sum, r) { return sum + r.promotionBonusSp; },
            0
          );
        }

        function getSpSummary(state) {
          var fromXpSp = Math.floor(state.totalXp / 100);
          var fromPromotionSp = getEarnedPromotionSp(state.totalXp);
          var totalEarnedSp = fromXpSp + fromPromotionSp;
          var spentSp = STAT_KEYS.reduce(function (sum, key) {
            return sum + Math.max(0, state.stats[key] - 1);
          }, 0);
          return {
            fromXpSp: fromXpSp,
            fromPromotionSp: fromPromotionSp,
            totalEarnedSp: totalEarnedSp,
            spentSp: spentSp,
            availableSp: Math.max(0, totalEarnedSp - spentSp),
          };
        }

        function calculateStudyStreak(sessions) {
          if (!sessions || sessions.length === 0) return 0;
          var activeDates = {};
          for (var i = 0; i < sessions.length; i++) {
            if (sessions[i].minutes > 0 || sessions[i].totalXp > 0) {
              activeDates[sessions[i].date] = true;
            }
          }
          function fmt(d) {
            return (
              d.getFullYear() +
              '-' +
              String(d.getMonth() + 1).padStart(2, '0') +
              '-' +
              String(d.getDate()).padStart(2, '0')
            );
          }
          var cursor = new Date();
          if (!activeDates[fmt(cursor)]) {
            cursor.setDate(cursor.getDate() - 1);
            if (!activeDates[fmt(cursor)]) return 0;
          }
          var streak = 0;
          while (activeDates[fmt(cursor)]) {
            streak += 1;
            cursor.setDate(cursor.getDate() - 1);
          }
          return streak;
        }

        function calculateCombatStudyPower(state, streak) {
          var rank = getRankByXp(state.totalXp);
          var statSum = STAT_KEYS.reduce(function (sum, key) { return sum + state.stats[key]; }, 0);
          return rank.order * 120 + statSum * 45 + streak * 30 + Math.floor(state.totalXp / 25);
        }

        function calculateDDay(examDateStr) {
          if (!examDateStr || !/^\d{4}-\d{2}-\d{2}$/.test(examDateStr)) return null;
          var parts = examDateStr.split('-').map(Number);
          var target = new Date(parts[0], parts[1] - 1, parts[2]);
          var now = new Date();
          var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          var diffDays = Math.round((target.getTime() - today.getTime()) / 86400000);
          var label =
            diffDays > 0
              ? 'D-' + diffDays
              : diffDays === 0
                ? 'D-DAY'
                : 'D+' + Math.abs(diffDays);
          return {
            diffDays: diffDays,
            label: label,
            formattedDate: formatKoreanDate(examDateStr),
          };
        }

        function sortExamsByDate(exams) {
          var mapped = (exams || []).map(function (exam) {
            return { exam: exam, dDay: calculateDDay(exam.date) };
          });
          return mapped.sort(function (a, b) {
            if (!a.dDay && !b.dDay) return 0;
            if (!a.dDay) return 1;
            if (!b.dDay) return -1;
            var aUp = a.dDay.diffDays >= 0;
            var bUp = b.dDay.diffDays >= 0;
            if (aUp && !bUp) return -1;
            if (!aUp && bUp) return 1;
            if (aUp && bUp) return a.dDay.diffDays - b.dDay.diffDays;
            return b.dDay.diffDays - a.dDay.diffDays;
          });
        }

        function getPrimaryExam(exams) {
          var sorted = sortExamsByDate(exams).filter(function (item) {
            return item.dDay !== null;
          });
          return sorted.length > 0 ? sorted[0] : null;
        }

        function roundToFive(num) {
          return Math.max(10, Math.round(num / 5) * 5);
        }

        function generateDailyPlan(options) {
          var date = options.date;
          var dailyGoalMinutes = options.dailyGoalMinutes;
          var track = options.track;
          var variantOffset = options.variantOffset || 0;
          var trackMeta = STUDY_TRACK_META[track] || STUDY_TRACK_META.balanced;

          var numericDate = Number(String(date).replace(/-/g, '')) || 0;
          var templateIdx = (numericDate + variantOffset) % trackMeta.templates.length;
          var selectedTemplates = trackMeta.templates[templateIdx];

          var activeTemplates =
            dailyGoalMinutes <= 45
              ? selectedTemplates.slice(0, 2)
              : dailyGoalMinutes <= 75
                ? selectedTemplates.slice(0, 3)
                : selectedTemplates;

          var totalWeight = activeTemplates.reduce(function (sum, t) { return sum + t.weight; }, 0);
          var nowIso = new Date().toISOString();
          var remaining = Math.max(20, dailyGoalMinutes);

          return activeTemplates.map(function (tpl, idx) {
            var isLast = idx === activeTemplates.length - 1;
            var allocated = isLast
              ? Math.max(10, remaining)
              : Math.min(
                  remaining - (activeTemplates.length - 1 - idx) * 10,
                  roundToFive((dailyGoalMinutes * tpl.weight) / totalWeight)
                );
            remaining -= allocated;
            return {
              id: 'auto-' + date + '-' + Date.now() + '-' + idx + '-' + Math.random().toString(36).slice(2, 5),
              title: tpl.title,
              category: tpl.category,
              targetMinutes: allocated,
              loggedMinutes: 0,
              difficulty: tpl.difficulty,
              completed: false,
              xpAwarded: 0,
              isAutoGenerated: true,
              createdAt: nowIso,
              scheduledDate: date,
            };
          });
        }

        function savePlannerState(nextState) {
          var serialized = JSON.stringify(nextState);
          memoryFallbackRaw = serialized;
          try {
            window.localStorage.setItem(STORAGE_KEY, serialized);
          } catch (_e) {
            // Safe fallback on restricted file:// environments
          }
        }

        function loadPlannerState() {
          try {
            var raw = null;
            try {
              raw = window.localStorage.getItem(STORAGE_KEY);
            } catch (_e) {
              raw = memoryFallbackRaw;
            }
            if (!raw) return createInitialState();
            var parsed = JSON.parse(raw);
            if (!parsed || typeof parsed.totalXp !== 'number' || !parsed.stats || !parsed.profile) {
              return createInitialState();
            }

            if (!parsed.profile.studyTrack) parsed.profile.studyTrack = 'balanced';
            if (typeof parsed.profile.autoPlanEnabled !== 'boolean') parsed.profile.autoPlanEnabled = true;
            if (!parsed.profile.branch) parsed.profile.branch = 'army';
            if (!Array.isArray(parsed.profile.exams)) {
              var legacyTitle = typeof parsed.profile.examTitle === 'string' && parsed.profile.examTitle.trim()
                ? parsed.profile.examTitle.trim()
                : '목표 시험';
              var legacyDate = typeof parsed.profile.examDate === 'string' && parsed.profile.examDate.trim()
                ? parsed.profile.examDate
                : getDefaultExamDateStr(60);
              parsed.profile.exams = [{ id: 'exam-migrated-1', title: legacyTitle, date: legacyDate }];
              delete parsed.profile.examTitle;
              delete parsed.profile.examDate;
            }

            parsed.claimedPromotionIds = MILITARY_RANKS.filter(function (r) {
              return parsed.totalXp >= r.minXp;
            }).map(function (r) {
              return r.id;
            });

            if (!Array.isArray(parsed.unlockedMedalIds)) {
              var st = calculateStudyStreak(parsed.sessions || []);
              var tm = (parsed.sessions || []).reduce(function (sum, s) { return sum + s.minutes; }, 0);
              parsed.unlockedMedalIds = MEDAL_DEFINITIONS.filter(function (m) {
                return m.checkUnlocked(parsed, st, tm);
              }).map(function (m) {
                return m.id;
              });
            }

            var today = getTodayDateStr();
            var hasTodayTasks = (parsed.tasks || []).some(function (t) {
              return t.scheduledDate === today;
            });
            if (parsed.profile.autoPlanEnabled && !hasTodayTasks) {
              var autoTasks = generateDailyPlan({
                date: today,
                dailyGoalMinutes: parsed.profile.dailyGoalMinutes || 120,
                track: parsed.profile.studyTrack,
              });
              parsed.tasks = autoTasks.concat(parsed.tasks || []);
            }

            return parsed;
          } catch (_err) {
            return createInitialState();
          }
        }

        function resetRankOnlyState(prev) {
          var baseReset = Object.assign({}, prev, {
            totalXp: 0,
            stats: {
              concentration: 1,
              intellect: 1,
              memory: 1,
              endurance: 1,
              willpower: 1,
            },
            claimedPromotionIds: ['recruit'],

          var st = calculateStudyStreak(baseReset.sessions);
          var tm = baseReset.sessions.reduce(function (sum, s) { return sum + s.minutes; }, 0);
          baseReset.unlockedMedalIds = MEDAL_DEFINITIONS.filter(function (m) {
            return m.checkUnlocked(baseReset, st, tm);
          }).map(function (m) {
            return m.id;
          });
          return baseReset;
        }

        function resetAllPlannerData() {
          var fresh = createInitialState();

            pts.push((cx + Math.cos(angle) * rad).toFixed(2) + ',' + (cy + Math.sin(angle) * rad).toFixed(2));

            '</svg>'
          );
        }

        function renderStatRadarSvg(stats) {
          var values = STAT_KEYS.map(function (k) { return stats[k]; });
          var highest = Math.max.apply(null, values.concat([5]));
          var scaleMax = Math.max(10, Math.ceil(highest / 5) * 5);
          var cx = 160;
          var cy = 148;
          var radius = 92;
          var levels = [0.25, 0.5, 0.75, 1];

          function pt(index, ratio) {
            var angle = ((Math.PI * 2) / 5) * index - Math.PI / 2;
            return {
              x: cx + Math.cos(angle) * radius * ratio,
              y: cy + Math.sin(angle) * radius * ratio,
            };
          }

          var gridsSvg = levels
            .map(function (lvl, idx) {
              var pts = STAT_KEYS.map(function (_k, sIdx) {
                var p = pt(sIdx, lvl);
                return p.x.toFixed(1) + ',' + p.y.toFixed(1);
              }).join(' ');
              return '<polygon points="' + pts + '" fill="' + (idx === levels.length - 1 ? '#141B22' : 'none') + '" stroke="#27313D" stroke-width="1"/>';
            })
            .join('');

          var spokesSvg = STAT_KEYS.map(function (_k, sIdx) {
            var p = pt(sIdx, 1);
            return '<line x1="' + cx + '" y1="' + cy + '" x2="' + p.x.toFixed(1) + '" y2="' + p.y.toFixed(1) + '" stroke="#27313D" stroke-width="1"/>';
          }).join('');

          var dataPts = STAT_KEYS.map(function (key, idx) {
            var ratio = Math.min(1, Math.max(0.1, stats[key] / scaleMax));
            return pt(idx, ratio);
          });

          var polyStr = dataPts.map(function (p) { return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');
          var dotsSvg = dataPts
            .map(function (p) {
              return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="4" fill="#F6D57A" stroke="#0F1419" stroke-width="1.5"/>';
            })
            .join('');

          var labelsSvg = STAT_KEYS.map(function (key, idx) {
            var angle = ((Math.PI * 2) / 5) * idx - Math.PI / 2;
            var lr = radius + 28;
            var lx = cx + Math.cos(angle) * lr;
            var ly = cy + Math.sin(angle) * lr;
            var anchor = Math.abs(Math.cos(angle)) < 0.2 ? 'middle' : Math.cos(angle) > 0 ? 'start' : 'end';
            return (
              '<g>' +
              '<text x="' + lx.toFixed(1) + '" y="' + (ly - 3).toFixed(1) + '" text-anchor="' + anchor + '" fill="#E6EDF3" font-size="12" font-weight="600">' + STAT_META[key].label + '</text>' +
              '<text x="' + lx.toFixed(1) + '" y="' + (ly + 12).toFixed(1) + '" text-anchor="' + anchor + '" fill="#D4A843" font-size="11" font-family="JetBrains Mono, monospace" font-weight="600">Lv.' + stats[key] + '</text>' +
              '</g>'
            );
          }).join('');

          return (
            '<div style="width:100%;display:flex;justify-content:center;">' +
            '<svg viewBox="0 0 320 295" style="width:100%;max-width:320px;height:auto;" role="img" aria-label="5대 학습 능력치 레이더 차트">' +
            gridsSvg +
            spokesSvg +
            '<polygon points="' + polyStr + '" fill="rgba(212, 168, 67, 0.22)" stroke="#D4A843" stroke-width="2" stroke-linejoin="round"/>' +
            dotsSvg +
            labelsSvg +
            '</svg></div>'
          );
        }

        function showToast(title, detail) {
          if (ui.toastTimerId) {
            window.clearTimeout(ui.toastTimerId);
          }
          ui.toast = { title: title, detail: detail || '' };
          renderToast();
          ui.toastTimerId = window.setTimeout(function () {
            ui.toast = null;
            renderToast();
          }, 3600);
        }

        function downloadIndexHtml() {
          var clone = document.documentElement.cloneNode(true);
          var mountIds = ['app-sidebar', 'app-header', 'mobile-drawer', 'app-main', 'modal-root', 'toast-root'];
          for (var i = 0; i < mountIds.length; i++) {
            var el = clone.querySelector('#' + mountIds[i]);
            if (el) {
              el.innerHTML = '';
              if (mountIds[i] === 'mobile-drawer') {
                el.setAttribute('hidden', '');
              }
            }
          }
          var htmlContent = '<!doctype html>\n' + clone.outerHTML;
          var blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
          var url = URL.createObjectURL(blob);
          var link = document.createElement('a');
          link.href = url;
          link.download = 'index.html';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          window.setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1000);
          showToast('index.html 파일이 다운로드되었습니다', 'GitHub에 올리면 Vercel에서 바로 배포할 수 있습니다.');
        }

        function resolveNewlyUnlockedMedals() {
          var streak = calculateStudyStreak(state.sessions);
          var totalMinutes = state.sessions.reduce(function (sum, s) { return sum + s.minutes; }, 0);
          var already = {};
          (state.unlockedMedalIds || []).forEach(function (id) { already[id] = true; });
          var newly = MEDAL_DEFINITIONS.filter(function (m) {
            return !already[m.id] && m.checkUnlocked(state, streak, totalMinutes);
          });
          if (newly.length === 0) return;

          state.unlockedMedalIds = (state.unlockedMedalIds || []).concat(
            newly.map(function (m) { return m.id; })
          );
          var pendingMap = {};
          ui.pendingMedals.forEach(function (m) { pendingMap[m.id] = true; });
          newly.forEach(function (m) {
            if (!pendingMap[m.id]) ui.pendingMedals.push(m);
          });
        }

        function applyXpAndCheckPromotion(addedXp, newSessions, updatedTasks) {
          var prevRank = getRankByXp(state.totalXp);
          state.totalXp += addedXp;
          var nextRank = getRankByXp(state.totalXp);

          if (nextRank.order > prevRank.order) {
            var newlyClaimed = MILITARY_RANKS.filter(function (r) {
              return (
                r.order > prevRank.order &&
                r.order <= nextRank.order &&
                state.claimedPromotionIds.indexOf(r.id) === -1
              );
            });
            var totalBonusSp = newlyClaimed.reduce(function (sum, r) { return sum + r.promotionBonusSp; }, 0);
            if (newlyClaimed.length > 0) {
              state.claimedPromotionIds = state.claimedPromotionIds.concat(
                newlyClaimed.map(function (r) { return r.id; })
              );
              ui.promotedRank = nextRank;
              ui.promotedBonusSp = totalBonusSp;
            }
          }

          if (updatedTasks) {
            state.tasks = updatedTasks;
          }
          state.sessions = newSessions.concat(state.sessions);
          resolveNewlyUnlockedMedals();
        }

        function completeStudyMinutes(payload, source) {
          var todayStr = getTodayDateStr();
          var streak = calculateStudyStreak(state.sessions);
          var xpCalc = computeSessionXp({
            minutes: payload.minutes,
            category: payload.category,
            source: source,
            stats: state.stats,
            streak: streak,
          });

          var mainSession = {
            id: 'sess-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5),
            taskId: payload.taskId || undefined,
            title: payload.title,
            category: payload.category,
            minutes: payload.minutes,
            baseXp: xpCalc.baseXp,
            bonusXp: xpCalc.bonusXp,
            totalXp: xpCalc.totalXp,
            source: source,
            date: todayStr,
            timestamp: new Date().toISOString(),
          };

          var sessionsToAdd = [mainSession];
          var totalAddedXp = xpCalc.totalXp;
          var autoCompletedTitle = null;

          var updatedTasks = payload.taskId
            ? state.tasks.map(function (t) {
                if (t.id !== payload.taskId) return t;
                var nextLogged = t.loggedMinutes + payload.minutes;
                if (!t.completed && nextLogged >= t.targetMinutes) {
                  var taskBonus = computeSessionXp({
                    minutes: t.targetMinutes,
                    category: t.category,
                    source: 'task',
                    difficulty: t.difficulty,
                    stats: state.stats,
                    streak: streak,
                  });
                  totalAddedXp += taskBonus.totalXp;
                  autoCompletedTitle = t.title;
                  sessionsToAdd.push({
                    id: 'sess-task-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5),
                    taskId: t.id,
                    title: t.title,
                    category: t.category,
                    minutes: 0,
                    baseXp: taskBonus.baseXp,
                    bonusXp: taskBonus.bonusXp,
                    totalXp: taskBonus.totalXp,
                    source: 'task',
                    date: todayStr,
                    timestamp: new Date().toISOString(),
                  });
                  return Object.assign({}, t, {
                    loggedMinutes: nextLogged,
                    completed: true,
                    xpAwarded: taskBonus.totalXp,
                    completedAt: new Date().toISOString(),
                  });
                }
                return Object.assign({}, t, { loggedMinutes: nextLogged });
              })
            : null;

          if (autoCompletedTitle && ui.selectedTaskId === payload.taskId) {
            ui.selectedTaskId = null;
          }

          applyXpAndCheckPromotion(totalAddedXp, sessionsToAdd, updatedTasks);
          persistAndRender();

          if (autoCompletedTitle) {
            showToast('집중 & 과제 자동 완료 +' + totalAddedXp + ' XP', autoCompletedTitle + ' 목표 달성');
          } else {
            var details = [payload.minutes + '분 집중'];
            if (xpCalc.bonusReasons.length > 0) details.push(xpCalc.bonusReasons.join(', '));
            showToast('학습 기록 완료 +' + totalAddedXp + ' XP', details.join(' · '));
          }
        }

        function stopTimerInterval() {
          if (ui.timer.intervalId) {
            window.clearInterval(ui.timer.intervalId);
            ui.timer.intervalId = null;
          }
          ui.timer.isRunning = false;
        }

        function getActiveTimerTask() {
          var todayStr = getTodayDateStr();
          return (
            state.tasks.find(function (t) {
              return t.id === ui.selectedTaskId && t.scheduledDate === todayStr && !t.completed;
            }) || null
          );
        }

        function getTimerPreviewInfo() {
          var selectedTask = getActiveTimerTask();
          var cat = selectedTask ? selectedTask.category : ui.timer.freeCategory;
          var streak = calculateStudyStreak(state.sessions);
          var previewMins =
            ui.timer.mode === 'pomodoro' && ui.timer.secondsElapsed === 0
              ? ui.timer.presetMinutes
              : Math.max(1, Math.floor(ui.timer.secondsElapsed / 60));
          var xpPreview = computeSessionXp({
            minutes: previewMins,
            category: cat,
            source: 'timer',
            stats: state.stats,
            streak: streak,
          });
          var targetSeconds = ui.timer.presetMinutes * 60;
          var displaySeconds =
            ui.timer.mode === 'pomodoro'
              ? Math.max(0, targetSeconds - ui.timer.secondsElapsed)
              : ui.timer.secondsElapsed;
          var mm = String(Math.floor(displaySeconds / 60)).padStart(2, '0');
          var ss = String(displaySeconds % 60).padStart(2, '0');
          var progressRatio =
            ui.timer.mode === 'pomodoro'
              ? Math.min(100, (ui.timer.secondsElapsed / Math.max(1, targetSeconds)) * 100)
              : Math.min(100, ((ui.timer.secondsElapsed % 3600) / 3600) * 100);
          return {
            selectedTask: selectedTask,
            category: cat,
            previewMinutes: previewMins,
            xpPreview: xpPreview,
            formattedTime: mm + ':' + ss,
            progressRatio: progressRatio,
            targetSeconds: targetSeconds,
          };
        }

        function updateTimerLiveDom() {
          var clockEl = document.getElementById('timer-clock');
          var progEl = document.getElementById('timer-progress');
          var xpEl = document.getElementById('timer-xp-preview');
          var claimEl = document.getElementById('timer-claim-btn');
          if (!clockEl) return;

          var info = getTimerPreviewInfo();
          clockEl.textContent = info.formattedTime;
          if (progEl) progEl.style.width = info.progressRatio.toFixed(2) + '%';
          if (xpEl) {
            var labelText =
              ui.timer.mode === 'pomodoro' && ui.timer.secondsElapsed === 0
                ? ui.timer.presetMinutes + '분 완주 시 예상 보상'
                : info.previewMinutes + '분 기록 예상 보상';
            xpEl.innerHTML =
              '<span>' + escapeHtml(labelText) + '</span>' +
              '<span aria-hidden="true">·</span>' +
              '<span class="font-mono" style="font-weight:600;color:#D4A843;">+' + info.xpPreview.totalXp + ' XP</span>' +
              (info.xpPreview.bonusXp > 0
                ? '<span aria-hidden="true">·</span><span style="color:#5E8C61;">스탯 보너스 +' + info.xpPreview.bonusXp + '</span>'
                : '');
          }
          if (claimEl) {
            var canClaim = ui.timer.secondsElapsed >= 60;
            if (canClaim && claimEl.hidden) {
              claimEl.hidden = false;
            }
          }
        }

        function startTimerInterval() {
          if (ui.timer.intervalId) window.clearInterval(ui.timer.intervalId);

              stopTimerInterval();
              var selectedTask = getActiveTimerTask();
              var cat = selectedTask ? selectedTask.category : ui.timer.freeCategory;
              var earnedMins = Math.max(1, Math.round(targetSeconds / 60));

                  category: cat,
                  minutes: earnedMins,
                },
                'timer'
              );
              return;

            updateTimerLiveDom();
          }, 1000);
          renderApp();

        function renderHistoryView() {
          var totalMinutes = state.sessions.reduce(function (sum, s) { return sum + s.minutes; }, 0);

            if (!dailyMap[s.date]) dailyMap[s.date] = { minutes: 0, xp: 0 };
            dailyMap[s.date].minutes += s.minutes;
            dailyMap[s.date].xp += s.totalXp;
          });

          var heatmapDays = [];
          var today = new Date();
          for (var i = 83; i >= 0; i--) {
            var d = new Date(today);
            d.setDate(today.getDate() - i);
            var ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            var info = dailyMap[ds] || { minutes: 0, xp: 0 };
            heatmapDays.push({ date: ds, minutes: info.minutes, xp: info.xp });
          }

          var last7 = heatmapDays.slice(-7);
          var max7 = Math.max.apply(null, [state.profile.dailyGoalMinutes, 60].concat(last7.map(function (x) { return x.minutes; })));

          function heatStyle(mins) {
            if (mins === 0) return 'background:#0F1419;border-color:#232B35;';
            if (mins < 30) return 'background:#364F39;border-color:#446348;';
            if (mins < 60) return 'background:#5E8C61;border-color:#6EA171;';
            if (mins < 120) return 'background:#B38B32;border-color:#C99F3E;';

              if (q && s.title.toLowerCase().indexOf(q) === -1) return false;
              return true;

          var heatCellsHtml = heatmapDays
            .map(function (day) {
              return '<div class="heat-cell" title="' + day.date + ': ' + day.minutes + '분 (+' + day.xp + ' XP)" style="' + heatStyle(day.minutes) + '"></div>';
            })
            .join('');

          var barsHtml = last7
            .map(function (day) {
              var hPct = Math.max(4, Math.round((day.minutes / max7) * 100));

            '<p class="tabular-nums" style="margin-top:2px;font-size:12px;color:var(--text-muted);">누적 공부 시간 ' + formatMinutesKorean(totalMinutes) + ' · 총 ' + state.sessions.length + '회 기록</p>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);">' +
            '<span>적음</span>' +
            '<span style="width:12px;height:12px;border-radius:2px;border:1px solid #232B35;background:#0F1419;"></span>' +
            '<span style="width:12px;height:12px;border-radius:2px;border:1px solid #446348;background:#364F39;"></span>' +
            '<span style="width:12px;height:12px;border-radius:2px;border:1px solid #6EA171;background:#5E8C61;"></span>' +
            '<span style="width:12px;height:12px;border-radius:2px;border:1px solid #C99F3E;background:#B38B32;"></span>' +
            '<span style="width:12px;height:12px;border-radius:2px;border:1px solid #F6D57A;background:#D4A843;"></span>' +

              '<div style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#F6D57A;">' + iconSvg('rotate', 16) + '<span>계급 · 경험치 · 스탯만 초기화</span></div>' +
              '<p style="margin-top:6px;font-size:12px;line-height:1.5;color:var(--text-muted);">훈련병(0 XP)과 기본 스탯(Lv.1)으로 돌아가며, 지금까지 쌓은 학습 시간 히트맵과 일지는 그대로 유지됩니다.</p>' +
              '</button>' +
              '<button type="button" data-action="confirm-reset-all" style="width:100%;text-align:left;border-radius:12px;border:1px solid rgba(220,38,38,0.45);background:var(--bg-canvas);padding:16px;">' +
              '<div style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#FCA5A5;">' + iconSvg('trash', 16) + '<span>전체 학습 기록까지 모두 초기화</span></div>' +
              '<p style="margin-top:6px;font-size:12px;line-height:1.5;color:var(--text-muted);">계급, 스탯, 학습 일지, 오늘의 과제, 훈장을 모두 지우고 완전히 처음 상태로 되돌립니다.</p>' +
              '</button>' +
